[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-impact-assessment"
version = "0.1.0"
description = "Multi-Sensor Flood Impact Evidence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Flood Impact Assessment Team" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "rasterio>=1.3.8",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "pyproj>=3.6.0",
    "torch>=2.0.0",
    "torchvision",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "reportlab>=4.0.0",
    "huggingface-hub>=0.20.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geospatial*", "ml*", "services*", "reports*"]
exclude = ["tests*", "apps*", "data*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E712", "W293", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
